name: app-android

# The Ozimut companion app for Android (app/android, docs/app/design.md): built and tested on every push touching it.
# Unsigned unless the keystore secrets exist; without APP_GOOGLE_SERVICES_JSON it is built without native notifications.
on:
  push:
    paths:
      - "app/android/**"
      - ".github/workflows/app-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Firebase configuration (only when the secret exists)
        env:
          APP_GOOGLE_SERVICES_JSON: ${{ secrets.APP_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$APP_GOOGLE_SERVICES_JSON" ]; then
            echo "$APP_GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "Built with native notifications (FCM)."
          else
            echo "No Firebase secret: built without native notifications."
          fi

      - name: Release keystore (only when the secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release build will be signed."
          else
            echo "No keystore secret: the release build stays unsigned."
          fi

      - name: Build and test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          TASKS="testDebugUnitTest assembleDebug assembleRelease lintDebug"
          # the bundle for Google Play only when it can be signed
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then TASKS="$TASKS bundleRelease"; fi
          gradle --no-daemon --console=plain -PversionCode=${{ github.run_number }} $TASKS 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Errors as annotations
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/build.log" "$GITHUB_WORKSPACE" <<'PY'
          import re, sys
          log, root = sys.argv[1], sys.argv[2].rstrip("/") + "/"
          try:
              lines = open(log, encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              sys.exit(0)
          seen = []
          def emit(msg, f=None, line=None, col=None):
              msg = msg.strip().replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              if not msg:
                  return
              key = (f, line, msg)
              if key in seen:
                  return
              seen.append(key)
              loc = ""
              if f:
                  f = f.replace("file://", "")
                  if f.startswith(root):
                      f = f[len(root):]
                  loc = " file=%s" % f
                  if line:
                      loc += ",line=%s" % line
                  if col:
                      loc += ",col=%s" % col
              print("::error%s::%s" % (loc, msg))
          kt = re.compile(r"^e: (?:file://)?(/[^:]+):(\d+):(\d+) (.*)$")
          gen = re.compile(r"(/[^\s:]+\.(?:kt|java|xml|kts)):(\d+)(?::(\d+))?:?\s*(?:AAPT: )?error:\s*(.*)", re.I)
          for i, l in enumerate(lines):
              m = kt.match(l)
              if m:
                  emit(m.group(4), m.group(1), m.group(2), m.group(3)); continue
              m = gen.search(l)
              if m:
                  emit(m.group(4), m.group(1), m.group(2), m.group(3)); continue
              if re.search(r"\bFAILED$", l) and ">" in l:
                  emit(l); continue
              if l.startswith("* What went wrong:"):
                  emit(" ".join(x.strip() for x in lines[i + 1:i + 6] if x.strip() and not x.startswith("*")))
                  continue
              if re.match(r"^(e: |error: |ERROR: )", l):
                  emit(l)
          print("%d error(s) found in the log" % len(seen))
          PY

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-android-test-reports
          path: |
            app/android/app/build/reports/tests/
            app/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v7
        with:
          name: ozimut-app-apk
          path: app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Signed bundle for Google Play
        if: env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          name: ozimut-app-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
