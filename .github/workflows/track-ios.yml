# Ozitrac for iPhone and Apple Watch (track/ios, docs/track/ozitrac.md): unsigned builds for the simulators — the iPhone
# app with its Live Activity widget, its notification extension and the watch app embedded, then the watch app alone —
# and the unit tests (sealing, the batch form, the code link, the queue, the engines, the QR codes). Signing and archiving
# come once the owner has an Apple Developer account and has set the secrets listed in track/ios/README.md.
name: track-ios

on:
  push:
    paths:
      - "track/ios/**"
      - ".github/workflows/track-ios.yml"
  workflow_dispatch:

concurrency:
  group: track-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: track/ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphonesimulator|watchsimulator" || true

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Error annotations helper
        run: |
          cat > "$RUNNER_TEMP/annotate.sh" <<'EOF'
          #!/bin/bash
          # Turns the compiler's « file:line:col: error: message » lines into GitHub annotations.
          log="$1"
          grep -E '^/[^:]+:[0-9]+(:[0-9]+)?: (fatal )?error: ' "$log" | sort -u | head -50 | while IFS= read -r line; do
            file=$(echo "$line" | sed -E 's/^([^:]+):([0-9]+).*/\1/')
            ln=$(echo "$line" | sed -E 's/^([^:]+):([0-9]+).*/\2/')
            msg=$(echo "$line" | sed -E 's/^[^:]+:[0-9]+(:[0-9]+)?: (fatal )?error: //')
            rel=${file#"$GITHUB_WORKSPACE/"}
            echo "::error file=$rel,line=$ln::$msg"
          done
          grep -E '^(error|xcodebuild: error|.*\*\* BUILD FAILED|.*\*\* TEST FAILED)' "$log" | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E ': error: |error: ' "$log" | grep -v '^/' | sort -u | head -20 || true
          EOF
          chmod +x "$RUNNER_TEMP/annotate.sh"

      - name: Build the iPhone app (and the embedded watch app, widget and notification extension) for the simulator
        run: |
          set +e
          xcodebuild build -project Ozitrac.xcodeproj -scheme Ozitrac -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO > build-ios.log 2>&1
          status=$?
          "$RUNNER_TEMP/annotate.sh" build-ios.log
          grep -E 'warning: ' build-ios.log | grep -v '^ld: ' | sort -u | head -60 || true
          tail -40 build-ios.log
          if [ $status -eq 0 ]; then
            app=$(find build/dd/Build/Products -name 'Ozitrac.app' -maxdepth 3 | head -1)
            echo "Built: $app"; ls "$app" "$app/Watch" "$app/PlugIns" 2>/dev/null || true
          fi
          exit $status

      - name: Build the watch app alone for the watch simulator
        if: always()
        run: |
          set +e
          xcodebuild build -project Ozitrac.xcodeproj -scheme OzitracWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath build/ddw \
            CODE_SIGNING_ALLOWED=NO > build-watch.log 2>&1
          status=$?
          "$RUNNER_TEMP/annotate.sh" build-watch.log
          tail -30 build-watch.log
          exit $status

      - name: Unit tests (sealing, batch form, code link, queue, engines, QR codes) on an iPhone simulator
        if: always()
        run: |
          set +e
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for k in reversed(ios):
              for dev in d[k]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "Simulator: $udid"
          xcodebuild test -project Ozitrac.xcodeproj -scheme OzitracTests -configuration Debug \
            -destination "id=$udid" -derivedDataPath build/ddt CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          "$RUNNER_TEMP/annotate.sh" test.log
          grep -E "Test Case .*(passed|failed)|error: -\[|XCTAssert|Executed [0-9]+ test" test.log | tail -60
          tail -20 test.log
          exit $status

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-ios-logs
          path: track/ios/*.log
          retention-days: 7
