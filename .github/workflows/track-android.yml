name: track-android

# Ozitrac for Android and its Wear OS app (track/android: modules app and wear): built and tested on every push touching it.
on:
  push:
    paths:
      - "track/android/**"
      - ".github/workflows/track-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: track/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Release keystore (only when the secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release build will be signed."
          else
            echo "No keystore secret: the release build stays unsigned."
          fi

      - name: Build and test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain -PversionCode=${{ github.run_number }} \
            testDebugUnitTest assembleDebug assembleRelease lintDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Errors as annotations
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/build.log" "$GITHUB_WORKSPACE" <<'PY'
          import re, sys
          log, root = sys.argv[1], sys.argv[2].rstrip("/") + "/"
          try:
              lines = open(log, encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              sys.exit(0)
          seen = []
          def emit(msg, f=None, line=None, col=None):
              msg = msg.strip().replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              if not msg:
                  return
              key = (f, line, msg)
              if key in seen:
                  return
              seen.append(key)
              loc = ""
              if f:
                  f = f.replace("file://", "")
                  if f.startswith(root):
                      f = f[len(root):]
                  loc = " file=%s" % f
                  if line:
                      loc += ",line=%s" % line
                  if col:
                      loc += ",col=%s" % col
              print("::error%s::%s" % (loc, msg))
          kt = re.compile(r"^e: (?:file://)?(/[^:]+):(\d+):(\d+) (.*)$")
          gen = re.compile(r"(/[^\s:]+\.(?:kt|java|xml|kts)):(\d+)(?::(\d+))?:?\s*(?:AAPT: )?error:\s*(.*)", re.I)
          for i, l in enumerate(lines):
              m = kt.match(l)
              if m:
                  emit(m.group(4), m.group(1), m.group(2), m.group(3)); continue
              m = gen.search(l)
              if m:
                  emit(m.group(4), m.group(1), m.group(2), m.group(3)); continue
              if re.search(r"\bFAILED$", l) and ">" in l:
                  emit(l); continue
              if l.startswith("* What went wrong:"):
                  emit(" ".join(x.strip() for x in lines[i + 1:i + 6] if x.strip() and not x.startswith("*")))
                  continue
              if re.match(r"^(e: |error: |ERROR: )", l):
                  emit(l)
          print("%d error(s) found in the log" % len(seen))
          PY

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            track/android/app/build/reports/tests/
            track/android/app/build/reports/lint-results-debug.html
            track/android/wear/build/reports/tests/
            track/android/wear/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v7
        with:
          name: ozitrac-android-apks
          path: track/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Wear OS APKs
        uses: actions/upload-artifact@v7
        with:
          name: ozitrac-wearos-apks
          path: track/android/wear/build/outputs/apk/**/*.apk
          if-no-files-found: error
