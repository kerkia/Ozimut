# Ozitrac for iPhone and Apple Watch (docs/track/ozitrac.md is the contract; docs/track/design.md for « Relier à Ozimut »).
# Generated into Ozitrac.xcodeproj by XcodeGen: `xcodegen generate` in this folder. Never edit the .xcodeproj by hand.
name: Ozitrac
options:
  bundleIdPrefix: com.ozimut
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # The owner's Apple Developer team (empty: unsigned builds only; see README.md).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The server the app talks to (the relay, and Ozimut once linked). A Debug build may point elsewhere.
    OZ_BASE_URL: "https://ozimut.com/"
  configs:
    Debug:
      OZ_BASE_URL: "https://ozimut.com/"
      OZ_APS_ENV: dev
    Release:
      OZ_APS_ENV: prod

targets:
  Ozitrac:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Core
      - path: Shared/UI
      - path: Shared/Activity
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ozitrac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, de, es]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # location: a run with the screen off; remote-notification: a watcher's request for Direct wakes a long run
        UIBackgroundModes: [location, remote-notification]
        NSSupportsLiveActivities: true
        OZBaseURL: $(OZ_BASE_URL)
        OZApsEnvironment: $(OZ_APS_ENV)
        NSLocationWhenInUseUsageDescription: "Ozitrac records your run and sends it, sealed, to the people you chose, only between Start and Stop."
        NSLocationTemporaryUsageDescriptionDictionary:
          TrackRun: "Live tracking needs your precise position."
        NSCameraUsageDescription: "The camera scans the code of the person you follow, or of your Ozimut account."
        CFBundleURLTypes:
          - CFBundleURLName: com.ozimut.ozitrac
            CFBundleURLSchemes: [ozitrac]
    entitlements:
      path: App/Ozitrac.entitlements
      properties:
        com.apple.developer.associated-domains: ["applinks:ozimut.com"]
        aps-environment: development
        com.apple.security.application-groups: [group.com.ozimut.ozitrac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozimut.ozitrac
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Ozitrac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: OzitracWidget
        embed: true
      - target: OzitracNotify
        embed: true
      - target: OzitracWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  OzitracWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/Activity
      - path: Resources/Localizable.xcstrings
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Ozitrac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozimut.ozitrac.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Words the relay's alerts with the name of the person followed (the relay knows no name).
  OzitracNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared/UI/L10n.swift
      - path: Resources/Localizable.xcstrings
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: Ozitrac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notify/OzitracNotify.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ozimut.ozitrac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozimut.ozitrac.notify
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  OzitracWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared/Core
      - path: Shared/UI
      - path: Resources
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Ozitrac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, de, es]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ozimut.ozitrac
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        OZBaseURL: $(OZ_BASE_URL)
        NSLocationWhenInUseUsageDescription: "Ozitrac records your run and sends it, sealed, to the people you chose, only between Start and Stop."
        NSHealthShareUsageDescription: "Ozitrac records your run as a workout."
        NSHealthUpdateUsageDescription: "Ozitrac saves your run as a workout with its route."
    entitlements:
      path: Watch/OzitracWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozimut.ozitrac.watchkitapp
        PRODUCT_NAME: OzitracWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  OzitracTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared/Core
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ozimut.ozitrac.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ozitrac:
    build:
      targets:
        Ozitrac: all
    run:
      config: Debug
    archive:
      config: Release
  OzitracWatch:
    build:
      targets:
        OzitracWatch: all
    run:
      config: Debug
  OzitracTests:
    build:
      targets:
        OzitracTests: [test]
    test:
      config: Debug
      targets: [OzitracTests]
